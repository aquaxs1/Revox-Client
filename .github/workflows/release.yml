name: Release

# Builds the Windows installer and the portable exe, signs them with the
# updater key, and publishes them as a GitHub Release.
#
# Two ways to start it:
#   - push a tag like v0.4.0
#   - Actions -> Release -> "Run workflow" (pick a version, no tag needed)
#
# Requires two repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           the minisign private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.4.0"
        required: true
        default: "0.4.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Rust builds dominate the runtime; caching turns a ~15 minute build into
      # a couple of minutes on later runs.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run the test suites
        run: |
          npm test -- --run
          cargo test --manifest-path src-tauri/Cargo.toml

      # The updater key is optional for getting a release out. A missing or
      # mangled secret used to fail the whole run after the build had already
      # succeeded, so nothing was ever published. Now a bad key only drops the
      # signed auto-update files: the installer and portable exe still ship.
      #
      # Accepted: the base64 string `tauri signer generate` prints (the normal
      # case), or the raw contents of the .key file, which is encoded here.
      - name: Check the updater signing key
        id: key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '\r')"
          if printf '%s' "$key" | head -c 18 | grep -q '^untrusted comment'; then
            key="$(printf '%s' "$key" | base64 -w0)"
          fi
          key="$(printf '%s' "$key" | tr -d ' \n')"
          # Decode the whole key the way Tauri does: base64 -> UTF-8 text ->
          # "untrusted comment" line plus a base64 key line. A key that only
          # starts right (mangled further in) must count as unusable too.
          if [ -n "$key" ] && KEY_B64="$key" node -e '
            const text = new TextDecoder("utf-8", { fatal: true }).decode(Buffer.from(process.env.KEY_B64, "base64"));
            const lines = text.trim().split(/\r?\n/);
            if (lines.length !== 2 || !lines[0].startsWith("untrusted comment:")) process.exit(1);
            if (!/^[A-Za-z0-9+/]+=*$/.test(lines[1]) || Buffer.from(lines[1], "base64").length < 100) process.exit(1);
          ' 2>/dev/null; then
            echo "::add-mask::$key"
            echo "usable=true" >> "$GITHUB_OUTPUT"
            { echo "TAURI_SIGNING_PRIVATE_KEY<<KEYEOF"; echo "$key"; echo "KEYEOF"; } >> "$GITHUB_ENV"
            echo "Signing key found: this release carries signed auto-update files."
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release is not signed for auto-update::TAURI_SIGNING_PRIVATE_KEY is missing or is not a minisign private key. The installer and portable exe are published, but installed copies will not be offered this release as an update. Paste the key again (see README, Releasing) and run the workflow for the next version."
          fi

      - name: Build, sign and publish
        if: steps.key.outputs.usable == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ github.event.inputs.version || github.ref_name }}
          releaseName: Revox Client v${{ github.event.inputs.version || github.ref_name }}
          releaseBody: |
            **Revox-Client_*_x64-setup.exe** — installer, German/English, no admin rights needed.
            **Revox-Client-Portable.exe** — single file, no installation.

            Needs the Microsoft Edge WebView2 runtime, which Windows 10 and 11
            already ship. The installer fetches it automatically if it is missing.
          releaseDraft: false
          prerelease: false
          # createUpdaterArtifacts is enabled only here, via the release-only
          # config override, so it only ever demands a signing key in this
          # workflow. A plain local `tauri build` needs no key at all.
          args: --bundles nsis --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json

      - name: Build and publish without updater signature
        if: steps.key.outputs.usable != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version || github.ref_name }}
          releaseName: Revox Client v${{ github.event.inputs.version || github.ref_name }}
          releaseBody: |
            **Revox-Client_*_x64-setup.exe** — installer, German/English, no admin rights needed.
            **Revox-Client-Portable.exe** — single file, no installation.

            Needs the Microsoft Edge WebView2 runtime, which Windows 10 and 11
            already ship. The installer fetches it automatically if it is missing.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis --target x86_64-pc-windows-msvc

      # The raw binary is a standalone portable build; the release above only
      # carries the installer, so it is attached separately under a clear name.
      - name: Attach the portable exe
        shell: pwsh
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { "${{ github.ref_name }}".TrimStart('v') }
          $source = "src-tauri/target/x86_64-pc-windows-msvc/release/revox-client.exe"
          if (-not (Test-Path $source)) {
            $source = "src-tauri/target/release/revox-client.exe"
          }
          Copy-Item $source "Revox-Client-Portable.exe"
          gh release upload "v$version" "Revox-Client-Portable.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
